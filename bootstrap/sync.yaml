apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authn-addons
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  path: ./clusters/lan
  sourceRef:
    kind: GitRepository
    name: authn-addons
  prune: true
  deletionPolicy: Orphan
  # Child readiness is checked by bootstrap/status, not by this parent.
  wait: false
