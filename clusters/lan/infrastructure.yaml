apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authn-namespaces
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: authn-addons
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 20m
  path: ./infrastructure/namespaces
  sourceRef: {kind: GitRepository, name: authn-addons}
  prune: false
  deletionPolicy: Orphan
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authn-sources
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: authn-addons
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 20m
  path: ./infrastructure/sources
  sourceRef: {kind: GitRepository, name: authn-addons}
  prune: true
  deletionPolicy: Orphan
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authn-isolation
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: authn-addons
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 20m
  path: ./infrastructure/isolation
  sourceRef: {kind: GitRepository, name: authn-addons}
  prune: false
  deletionPolicy: Orphan
  wait: true
  dependsOn:
    - name: authn-namespaces
    - name: cilium
    - name: storage-longhorn
---
