apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel
  namespace: authn-system
spec:
  releaseName: zitadel
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: zitadel
      version: 10.0.6
      sourceRef: {kind: HelmRepository, name: authn-zitadel, namespace: flux-system}
  install:
    remediation: {retries: -1}
  upgrade:
    remediation: {retries: 3}
  driftDetection: {mode: enabled}
  values:
    fullnameOverride: zitadel
    replicaCount: 1
    image: {repository: ghcr.io/zitadel/zitadel, tag: v4.15.3}
    postgresql: {enabled: false}
    ingress: {enabled: false}
    httpRoute: {enabled: false}
    grpcRoute: {enabled: false}
    service:
      port: 8080
      appProtocol: kubernetes.io/h2c
    zitadel:
      masterkeySecretName: zitadel-masterkey
      dbSslCaCrtSecret: zitadel-db-ca
      configmapConfig:
        ExternalDomain: auth.internal
        ExternalPort: 443
        ExternalSecure: true
        TLS: {Enabled: false}
        # Only the login service needs these headers; Gateway removes client values.
        InstanceHostHeaders: [x-zitadel-instance-host]
        PublicHostHeaders: [x-zitadel-public-host]
        Database:
          Postgres:
            Host: zitadel-db-rw.authn-system.svc.cluster.local
            Port: 5432
            Database: zitadel
            User:
              Username: zitadel
              SSL: {Mode: verify-full}
        DefaultInstance:
          Features:
            LoginV2: {Required: true, BaseURI: 'https://auth.internal/ui/v2/login'}
          LoginPolicy:
            AllowRegister: false
            ForceMFA: true
          Restrictions:
            DisallowPublicOrgRegistration: true
        FirstInstance:
          InstanceName: Elektro
          Org:
            Name: Elektro
            # Upstream setup job writes authn-provisioner and authn-provisioner-pat.
            # This identity is for deployment, never for ordinary agents.
            Machine:
              Machine: {Username: authn-provisioner, Name: Authn provisioning}
              MachineKey: {Type: 1, ExpirationDate: '2027-09-01T00:00:00Z'}
              Pat: {ExpirationDate: '2027-09-01T00:00:00Z'}
        SystemAPIUsers:
          domain-provisioner:
            Path: /domain-provisioner/tls.crt
            Memberships:
              - MemberType: System
                Roles: [SYSTEM_OWNER]
    env:
      - name: ZITADEL_DATABASE_POSTGRES_USER_PASSWORD
        valueFrom:
          secretKeyRef: {name: zitadel-db-app, key: password}
    extraVolumes:
      - name: domain-provisioner
        secret:
          secretName: zitadel-domain-provisioner
          items: [{key: tls.crt, path: tls.crt}]
    extraVolumeMounts:
      - {name: domain-provisioner, mountPath: /domain-provisioner, readOnly: true}
    initJob:
      command: zitadel
      activeDeadlineSeconds: 600
    setupJob:
      activeDeadlineSeconds: 600
    # Preserve bootstrap credentials if a release is accidentally removed.
    cleanupJob: {enabled: false}
    tools:
      kubectl:
        image: {repository: alpine/k8s, tag: 1.36.1}
    login:
      enabled: true
      fullnameOverride: zitadel-login
      image: {repository: ghcr.io/zitadel/zitadel-login, tag: v4.15.3}
      ingress: {enabled: false}
      httpRoute: {enabled: false}
      resources:
        requests: {cpu: 50m, memory: 128Mi}
        limits: {memory: 512Mi}
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 1Gi}
