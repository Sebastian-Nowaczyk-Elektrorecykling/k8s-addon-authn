apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oauth2-proxy
  namespace: authn-admin
spec:
  releaseName: oauth2-proxy
  interval: 10m
  timeout: 10m
  chart:
    spec:
      chart: oauth2-proxy
      version: 10.7.0
      sourceRef: {kind: HelmRepository, name: authn-oauth2-proxy, namespace: flux-system}
  install:
    remediation: {retries: -1}
  upgrade:
    remediation: {retries: 3}
  driftDetection: {mode: enabled}
  values:
    fullnameOverride: oauth2-proxy
    image: {registry: quay.io, repository: oauth2-proxy/oauth2-proxy, tag: v7.15.3}
    replicaCount: 1
    ingress: {enabled: false}
    config:
      existingSecret: oauth2-proxy-credentials
      configFile: |
        provider = "oidc"
        provider_display_name = "ZITADEL"
        oidc_issuer_url = "https://auth.internal"
        user_id_claim = "sub"
        scope = "openid profile email"
        redirect_url = "https://sso.admin.internal/oauth2/callback"
        code_challenge_method = "S256"
        skip_provider_button = true
        upstreams = ["static://202"]
        authenticated_emails_file = "/admin-access/emails"
        email_domains = []
        cookie_name = "__Secure-elektro_admin"
        cookie_domains = [".admin.internal"]
        cookie_secure = true
        cookie_httponly = true
        cookie_samesite = "lax"
        cookie_expire = "1h"
        cookie_refresh = "0"
        session_cookie_minimal = true
        whitelist_domains = ["hubble.admin.internal", "longhorn.admin.internal", "openfga.admin.internal", "garage.admin.internal", "heimdall.admin.internal", "sso.admin.internal"]
        # The gateway terminates TLS; this listener is only reachable by Heimdall.
        reverse_proxy = true
        provider_ca_files = ["/internal-ca/ca.crt"]
        pass_access_token = false
        pass_user_headers = false
        pass_authorization_header = false
        set_authorization_header = false
        skip_auth_strip_headers = false
    extraVolumes:
      - name: internal-ca
        configMap: {name: authn-internal-ca}
      - name: admin-access
        secret: {secretName: authn-admin-access}
    extraVolumeMounts:
      - {name: internal-ca, mountPath: /internal-ca, readOnly: true}
      - {name: admin-access, mountPath: /admin-access, readOnly: true}
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {memory: 256Mi}
