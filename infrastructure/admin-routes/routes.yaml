apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authenticated-administration
  namespace: authn-admin
spec:
  parentRefs: [{name: internal, namespace: gateway-system, sectionName: admin-https}]
  hostnames:
    - hubble.admin.internal
    - longhorn.admin.internal
    - sso.admin.internal
    - openfga.admin.internal
    - garage.admin.internal
    - heimdall.admin.internal
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      timeouts: {request: 0s, backendRequest: 0s}
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [Forwarded, X-Forwarded-Host, X-Forwarded-Uri, X-Forwarded-Method, X-Forwarded-Path, X-Auth-Request-Redirect]
            set: [{name: X-Forwarded-Proto, value: https}]
      backendRefs: [{name: heimdall, port: 4456}]
