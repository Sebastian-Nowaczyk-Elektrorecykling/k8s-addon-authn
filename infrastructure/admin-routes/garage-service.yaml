# Garage's chart only exposes S3 ports. Own a separate Service; do not edit it.
apiVersion: v1
kind: Service
metadata:
  name: authn-garage-admin
  namespace: garage
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: garage
    app.kubernetes.io/instance: garage
  ports:
    - {name: admin, port: 3903, targetPort: 3903, protocol: TCP}
