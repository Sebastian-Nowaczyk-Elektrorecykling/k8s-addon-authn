version: "1alpha4"
rules:
  # Only these OAuth endpoints are public. /oauth2/userinfo stays private.
  - id: sso-endpoints
    match:
      hosts: [{type: exact, value: sso.admin.internal}]
      routes:
        - {path: /oauth2/start}
        - {path: /oauth2/callback}
        - {path: /oauth2/sign_out}
    forward_to:
      host: oauth2-proxy.authn-admin.svc.cluster.local:80
      rewrite: {scheme: http}
    execute:
      - authenticator: public
      - finalizer: noop
  - id: hubble
    match:
      hosts: [{type: exact, value: hubble.admin.internal}]
      routes: [{path: /}, {path: /**}]
    forward_to:
      host: hubble-ui.kube-system.svc.cluster.local:80
      rewrite: {scheme: http}
    execute:
      - authenticator: admin-session
      - authorizer: browser-safety
      - finalizer: browser-upstream
    on_error:
      - error_handler: sign-in
        if: >-
          type(Error) == authentication_error &&
          Request.Header("Accept").contains("text/html")
  - id: longhorn
