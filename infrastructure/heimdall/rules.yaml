    on_error:
      - error_handler: sign-in
        if: >-
          type(Error) == authentication_error &&
          Request.Header("Accept").contains("text/html")
  - id: garage
    match:
      hosts: [{type: exact, value: garage.admin.internal}]
      routes: [{path: /}, {path: /**}]
    forward_to:
      host: authn-garage-admin.garage.svc.cluster.local:3903
      rewrite: {scheme: http}
    execute:
      - authenticator: admin-session
