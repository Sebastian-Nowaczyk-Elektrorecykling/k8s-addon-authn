# ZITADEL authenticates its own console. Never put the issuer/token endpoints
# behind a proxy whose own login depends on that issuer.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth
  namespace: authn-system
spec:
  parentRefs: [{name: internal, namespace: gateway-system, sectionName: apps-https}]
  hostnames: [auth.internal]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /ui/console}
      filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, hostname: zitadel.admin.internal, statusCode: 302}
    - matches:
        - path: {type: PathPrefix, value: /ui/v2/login}
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [Forwarded, X-Zitadel-Instance-Host, X-Zitadel-Public-Host, X-Forwarded-Host, X-Forwarded-Uri, X-Forwarded-Method]
      backendRefs: [{name: zitadel-login, port: 3000}]
    - matches:
        - path: {type: PathPrefix, value: /}
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [Forwarded, X-Zitadel-Instance-Host, X-Zitadel-Public-Host, X-Forwarded-Host, X-Forwarded-Uri, X-Forwarded-Method]
      backendRefs: [{name: zitadel, port: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zitadel-console
  namespace: authn-admin
spec:
  parentRefs: [{name: internal, namespace: gateway-system, sectionName: admin-https}]
  hostnames: [zitadel.admin.internal]
  rules:
    - matches:
        - path: {type: Exact, value: /}
      filters:
        - type: RequestRedirect
          requestRedirect:
            path: {type: ReplaceFullPath, replaceFullPath: /ui/console}
            statusCode: 302
    - matches:
        - path: {type: PathPrefix, value: /ui/v2/login}
      filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, hostname: auth.internal, statusCode: 302}
    - matches:
        - path: {type: PathPrefix, value: /}
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [Forwarded, X-Zitadel-Instance-Host, X-Zitadel-Public-Host, X-Forwarded-Host, X-Forwarded-Uri, X-Forwarded-Method]
      backendRefs: [{name: zitadel, namespace: authn-system, port: 8080}]
