apiVersion: apps/v1
kind: Deployment
metadata:
  name: authn-edge
  namespace: authn
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: authn-edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authn-edge
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: nginx
        image: nginx:1.30.5-alpine
        command:
        - nginx
        args:
        - -c
        - /config/nginx.conf
        - -g
        - daemon off;
        ports:
        - name: http
          containerPort: 8080
        securityContext: &id001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 3
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
        args:
        - --config=/config/oauth2-proxy.cfg
        env:
        - name: OAUTH2_PROXY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authn-secrets
              key: oauth2-client-secret
        - name: OAUTH2_PROXY_COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              name: authn-secrets
              key: cookie-secret
        securityContext: *id001
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: ca
          mountPath: /ca
          readOnly: true
      - name: authorizer
        image: python:3.13.15-alpine
        command:
        - python3
        - -B
        - /code/authorizer.py
        securityContext: *id001
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: secrets
          mountPath: /secrets
          readOnly: true
        - name: state
          mountPath: /state
          readOnly: true
        - name: code
          mountPath: /code
          readOnly: true
        - name: runtime
          mountPath: /runtime
          readOnly: true
        livenessProbe:
          exec:
            command:
            - python3
            - -c
            - import urllib.request; urllib.request.urlopen('http://127.0.0.1:9080/healthz',
              timeout=2)
          periodSeconds: 20
        env:
        - name: AUTHN_CONFIG
          value: /runtime
      - name: permissions
        image: python:3.13.15-alpine
        command:
        - python3
        - -B
        - /code/permissions.py
        env:
        - name: AUTHN_CONFIG
          value: /runtime
        - name: PERMISSIONS_HOST
          value: permissions.${ADMIN_DOMAIN}
        securityContext: &id002
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: code
          mountPath: /code
          readOnly: true
        - name: runtime
          mountPath: /runtime
          readOnly: true
        - name: secrets
          mountPath: /secrets
          readOnly: true
        - name: state
          mountPath: /state
          readOnly: true
        - name: discovery
          mountPath: /discovery
          readOnly: true
      volumes:
      - name: config
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      - name: ca
        configMap:
          name: authn-ca
      - name: secrets
        projected:
          sources:
          - secret:
              name: authn-secrets
              items:
              - key: openfga-token
                path: openfga-token
          - secret:
              name: authn-agents
              items:
              - key: agents.json
                path: agents.json
      - name: state
        configMap:
          name: authn-openfga-state
          optional: true
      - name: code
        configMap:
          name: authn-edge-config
      - name: runtime
        configMap:
          name: authn-runtime
      - name: discovery
        configMap:
          name: authn-discovery-status
      initContainers:
      - name: configuration
        image: python:3.13.15-alpine
        command:
        - python3
        - -B
        - /code/wait-config.py
        securityContext: *id002
        env:
        - name: EXPECTED_REVISION
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['authn.elektro.internal/revision']
        volumeMounts:
        - name: config
          mountPath: /config
        - name: runtime
          mountPath: /runtime
          readOnly: true
        - name: code
          mountPath: /code
          readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: authn-edge
  namespace: authn
spec:
  selector:
    app.kubernetes.io/name: authn-edge
  ports:
  - name: http
    port: 80
    targetPort: 8080
