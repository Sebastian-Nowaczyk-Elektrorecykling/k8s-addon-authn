apiVersion: apps/v1
kind: Deployment
metadata:
  name: authn-edge
  namespace: authn
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: authn-edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authn-edge
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: nginx
        image: nginx:1.30.5-alpine
        command:
        - nginx
        args:
        - -c
        - /config/nginx.conf
        - -g
        - daemon off;
        ports:
        - name: http
          containerPort: 8080
        securityContext: &id001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 3
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
        args:
        - --config=/config/oauth2-proxy.cfg
        env:
        - name: OAUTH2_PROXY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authn-secrets
              key: oauth2-client-secret
        - name: OAUTH2_PROXY_COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              name: authn-secrets
              key: cookie-secret
        securityContext: *id001
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: ca
          mountPath: /ca
          readOnly: true
      - name: authorizer
        image: python:3.13.15-alpine
        command:
        - python3
        - -B
        - /config/authorizer.py
        securityContext: *id001
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: secrets
          mountPath: /secrets
          readOnly: true
        - name: state
          mountPath: /state
          readOnly: true
        livenessProbe:
          exec:
            command:
            - python3
            - -c
            - import urllib.request; urllib.request.urlopen('http://127.0.0.1:9080/healthz',
              timeout=2)
          periodSeconds: 20
      volumes:
      - name: config
        configMap:
          name: authn-edge-config
      - name: tmp
        emptyDir: {}
      - name: ca
        configMap:
          name: authn-ca
      - name: secrets
        projected:
          sources:
          - secret:
              name: authn-secrets
              items:
              - key: openfga-token
                path: openfga-token
          - secret:
              name: authn-agents
              items:
              - key: agents.json
                path: agents.json
      - name: state
        configMap:
          name: authn-openfga-state
          optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: authn-edge
  namespace: authn
spec:
  selector:
    app.kubernetes.io/name: authn-edge
  ports:
  - name: http
    port: 80
    targetPort: 8080
