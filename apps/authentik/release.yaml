apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authn
spec:
  releaseName: authentik
  interval: 10m
  timeout: 20m
  chart:
    spec:
      chart: authentik
      version: 2026.8.3
      sourceRef:
        kind: HelmRepository
        name: authn-authentik
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
    ignore:
    - paths:
      - /spec/template/metadata/annotations/authn.elektro.internal~1revision
      target:
        kind: Deployment
        name: authentik-worker
        namespace: authn
  values:
    global:
      fullnameOverride: authentik
      env:
      - name: AUTHENTIK_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: authn-secrets
            key: authentik-secret-key
      - name: AUTHENTIK_POSTGRESQL__PASSWORD
        valueFrom:
          secretKeyRef:
            name: authentik-db-app
            key: password
      - name: OAUTH2_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: authn-secrets
            key: oauth2-client-secret
    authentik:
      postgresql:
        host: authentik-db-rw.authn.svc.cluster.local
        name: authentik
        user: authentik
      error_reporting:
        enabled: false
    postgresql:
      enabled: false
    serviceAccount:
      create: false
    blueprints:
      configMaps:
      - authn-runtime-blueprints
    server:
      replicas: 1
      serviceAccountName: default
      automountServiceAccountToken: false
      ingress:
        enabled: false
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1536Mi
    worker:
      replicas: 1
      automountServiceAccountToken: false
      env:
      - name: AUTHENTIK_BOOTSTRAP_PASSWORD
        valueFrom:
          secretKeyRef:
            name: authn-secrets
            key: bootstrap-password
      - name: AUTHENTIK_BOOTSTRAP_EMAIL
        valueFrom:
          secretKeyRef:
            name: authn-secrets
            key: bootstrap-email
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1536Mi
      initContainers:
      - name: wait-blueprint
        image: python:3.13.15-alpine
        command:
        - python3
        - -c
        - "import hashlib, os, time\nfrom pathlib import Path\nexpected = os.environ.get('EXPECTED_REVISION',\
          \ '')\nwhile expected and hashlib.sha256(Path('/blueprint/cluster-sites.yaml').read_bytes()).hexdigest()\
          \ != expected:\n    time.sleep(2)\n"
        env:
        - name: EXPECTED_REVISION
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['authn.elektro.internal/revision']
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
        - name: blueprints-cm-authn-runtime-blueprints
          mountPath: /blueprint
          readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            memory: 64Mi
